[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keras-neural-processes"
dynamic = ["version"]
description = "Neural processes (CNP, NP, ANP) in Keras with ragged-tensor support for sparse, irregular time series"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Siddharth Chaini", email = "sidchaini@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy>=1.25.2",
    "pandas>=2.0.3",
    "scipy>=1.10",
    "keras>=3",
    "tensorflow",
    "tensorflow-probability",
]

[tool.setuptools.dynamic]
version = {attr = "knp.__version__"}

[project.urls]
Repository = "https://github.com/sidchaini/keras-neural-processes"